[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-flash"
version = "1.0.0"
description = "Modern GTK4 GUI for safely writing ISO/IMG images to USB drives"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "gerchann"}
]
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
dd-flash = "dd_flash.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
